<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Year 3 Science Quiz – Plants, Food Chains & Organs</title>
<style>
:root{--bg:#effaf3;--cd:#fff;--tx:#17261d;--mu:#5d7266;--pr:#12915a;--ok:#12a150;--no:#e5484d;--bd:#cfe6d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--cd:#192a20;--tx:#eaf6ee;--mu:#9bb5a5;--pr:#3ccf8a;--bd:#2c4637}}
:root[data-theme="dark"]{--bg:#101a14;--cd:#192a20;--tx:#eaf6ee;--mu:#9bb5a5;--pr:#3ccf8a;--bd:#2c4637}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 14px 40px}main{max-width:680px;margin:0 auto}
h1{font-size:1.45rem;margin:16px 0 4px}h2{font-size:1.2rem;margin:14px 0 6px}.mu{color:var(--mu);font-size:.92rem}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
label.o{display:block;padding:10px 12px;margin:6px 0;border:2px solid var(--bd);border-radius:12px;cursor:pointer}label.o:has(input:checked){border-color:var(--pr)}label.o input{margin-right:8px}
input[type=text],select{width:100%;font:inherit;padding:11px;border:2px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);margin-top:6px}
button{font:inherit;border:0;border-radius:12px;padding:14px;width:100%;background:var(--pr);color:#fff;font-weight:700;margin:10px 0;min-height:50px;cursor:pointer}button.s{background:var(--cd);color:var(--tx);border:2px solid var(--bd)}
.fb{padding:9px 12px;border-radius:12px;margin-top:8px;font-size:.95rem}.g{background:rgba(18,161,80,.16)}.b{background:rgba(229,72,77,.16)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.big{font-size:2rem;font-weight:800;text-align:center}.wb{display:flex;flex-wrap:wrap;gap:6px}.wb span{border:2px dashed var(--pr);border-radius:99px;padding:2px 12px}svg{display:block;margin:6px auto;max-width:300px;width:100%}svg text{font:700 13px system-ui}
</style></head><body><main><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$("#app");
const W1=["Brain","Lungs","Heart","Liver","Stomach","Intestine"];
const BODY=`<svg viewBox="0 0 200 250" role="img" aria-label="Body with numbered organs"><ellipse cx="100" cy="42" rx="26" ry="28" fill="none" stroke="currentColor" stroke-width="3"/><path d="M62 85Q100 70 138 85L146 190Q100 215 54 190Z" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="100" cy="38" rx="16" ry="14" fill="#f4a6b8"/><ellipse cx="80" cy="108" rx="14" ry="22" fill="#9ec9f2"/><ellipse cx="120" cy="108" rx="14" ry="22" fill="#9ec9f2"/><circle cx="97" cy="118" r="11" fill="#e5484d"/><ellipse cx="84" cy="150" rx="22" ry="10" fill="#b5651d"/><ellipse cx="122" cy="148" rx="13" ry="10" fill="#f2a65a"/><path d="M80 175q20 14 40 0q-8 18-20 12q-12 6-20-12Z" fill="#f7d774" stroke="#a88a00"/><g fill="#fff" stroke="#000"><circle cx="100" cy="38" r="9"/><circle cx="76" cy="100" r="9"/><circle cx="97" cy="120" r="9"/><circle cx="76" cy="152" r="9"/><circle cx="124" cy="146" r="9"/><circle cx="100" cy="183" r="9"/></g><g fill="#000" text-anchor="middle"><text x="100" y="43">1</text><text x="76" y="105">2</text><text x="97" y="125">3</text><text x="76" y="157">4</text><text x="124" y="151">5</text><text x="100" y="188">6</text></g></svg>`;
const PLANT=`<svg viewBox="0 0 200 250" role="img" aria-label="Plant with numbered parts"><path d="M20 160H180" stroke="currentColor" stroke-width="4"/><path d="M100 160V70" stroke="#2e9e4f" stroke-width="6"/><ellipse cx="72" cy="118" rx="26" ry="10" transform="rotate(-25 72 118)" fill="#4cc26b"/><ellipse cx="130" cy="100" rx="26" ry="10" transform="rotate(25 130 100)" fill="#4cc26b"/><g fill="#f78fb3"><circle cx="100" cy="30" r="14"/><circle cx="82" cy="46" r="14"/><circle cx="118" cy="46" r="14"/><circle cx="88" cy="68" r="14"/><circle cx="112" cy="68" r="14"/></g><circle cx="100" cy="50" r="12" fill="#ffd33d"/><path d="M100 160q-20 30-40 50M100 160q0 40 0 60M100 160q20 30 40 50" stroke="#8a5a2b" stroke-width="4" fill="none"/><g fill="#fff" stroke="#000"><circle cx="100" cy="50" r="9"/><circle cx="100" cy="125" r="9"/><circle cx="62" cy="108" r="9"/><circle cx="100" cy="200" r="9"/></g><g text-anchor="middle" fill="#000"><text x="100" y="55">1</text><text x="100" y="130">2</text><text x="62" y="113">3</text><text x="100" y="205">4</text></g></svg>`;
const mc=(t,o,a,e)=>[t,"mc",a,o,e],sl=(t,o,a,e)=>[t,"sel",a,o,e],tx=(t,re,m,e)=>[t,"tx",re,m,e];
const TF=["True","False"],ABC=["A","B","C","D","E"];
const S=[
{h:"Q1 · Choose the correct answer",q:[mc("Which part of a plant absorbs water from the soil?",["Flower","Roots","Leaves","Fruit"],"Roots","Roots take in water and minerals."),mc("Which part of a plant makes food using sunlight?",["Leaves","Roots","Stem","Flower"],"Leaves","Leaves make food using sunlight."),mc("Which organ pumps blood around the body?",["Brain","Lungs","Heart","Stomach"],"Heart","The heart pumps blood."),mc("Which organ helps us breathe?",["Stomach","Lungs","Brain","Heart"],"Lungs","We breathe with our lungs."),mc("Which organ helps us think and remember?",["Heart","Brain","Stomach","Lungs"],"Brain","The brain controls thinking and memory.")]},
{h:"Q2 · Fill in the blanks",box:["stem","brain","sunlight","producer","water","roots"],q:[sl("A green plant is called a ______ in a food chain.",0,"producer","Plants make their own food."),sl("Plants need ______ to make their own food.",0,"sunlight","Plants use sunlight energy."),sl("The ______ supports the plant and carries water to its leaves.",0,"stem","The stem holds the plant up."),sl("The ______ controls the human body.",0,"brain","The brain is the control centre."),sl("Plants need ______ to grow well.",0,"water","No water, no healthy growth."),sl("A plant absorbs water from the soil through its ______.",0,"roots","Roots absorb water.")]},
{h:"Q3 · True or False",q:[sl("The Sun provides energy for most food chains.",TF,"True","All energy starts from the Sun."),sl("A rabbit is a producer.",TF,"False","A rabbit eats plants, so it is a consumer."),sl("Roots help to hold a plant firmly in the soil.",TF,"True","Roots anchor the plant."),sl("The stomach pumps blood around the body.",TF,"False","The heart pumps blood. The stomach breaks down food."),sl("The Sun is a producer in a food chain.",TF,"False","The Sun is the energy source. Plants are the producers."),sl("A plant can grow healthy without water.",TF,"False","Plants need water."),sl("The lungs help us breathe.",TF,"True","Lungs take in air.")]},
{h:"Q4 · Parts of a flowering plant",box:["flower","leaves","stem","roots"],q:[sl("The colourful part that may develop into a fruit:",0,"flower","Flowers can become fruit."),sl("The part that makes food:",0,"leaves","Leaves make food."),sl("The part that supports the plant:",0,"stem","The stem supports the plant."),sl("The part that absorbs water and minerals:",0,"roots","Roots absorb water and minerals.")]},
{h:"Q5 · Food chain",note:"Sun → Grass → Grasshopper → Frog → Snake",q:[tx("a) What is the source of energy in this food chain?","sun","The Sun","Energy comes from the Sun."),tx("b) Which organism is the producer?","grass","Grass","Grass makes its own food."),tx("c) Which animal eats the grasshopper?","frog","The frog","The arrow points from grasshopper to frog.")]},
{h:"Q6 · Human organs",svg:BODY,note:"Choose the name of each numbered organ.",q:[sl("1",W1,"Brain","In the head."),sl("2",W1,"Lungs","Two lungs for breathing."),sl("3",W1,"Heart","Pumps blood."),sl("4",W1,"Liver","Large organ on the right of the stomach."),sl("5",W1,"Stomach","Breaks down food."),sl("6",W1,"Intestine","The long coiled tube.")]},
{h:"Q7 · Match organ and function",note:"A. Helps break down food · B. Sends messages to other parts of the body · C. Pumps blood",q:[sl("Brain",["A","B","C"],"B","The brain sends messages."),sl("Heart",["A","B","C"],"C","The heart pumps blood."),sl("Stomach",["A","B","C"],"A","The stomach helps break down food.")]},
{h:"Q8 · Growing a healthy plant",note:"Two similar plants are in the same sunny place. Plant A is watered every day. Plant B is not watered.",q:[tx("a) What is the student investigating?","water","Whether plants need water to grow","The only thing that changes is water."),tx("b) Which plant will grow more healthily?","\\ba\\b","Plant A","It gets water."),tx("c) Which plant will NOT grow more healthily?","\\bb\\b","Plant B","It gets no water."),tx("d) Name TWO things a plant needs to grow well (e.g. water and sunlight).","TWO","Any two of: water, sunlight, air, space, nutrients","Plants need water, light, air and nutrients.")]},
{h:"Q9 · Match Column A with Column B",note:"A. Source of light energy for plants · B. A diagram that shows how living things get food · C. An animal that eats plants or other animals · D. Shows the direction of energy flow · E. A plant that makes its own food using sunlight",q:[sl("Food chain",ABC,"B","A food chain diagram shows who eats what."),sl("Sun",ABC,"A","The Sun is the energy source."),sl("Consumer",ABC,"C","Consumers eat other living things."),sl("Arrow",ABC,"D","Arrows show energy flow."),sl("Producer",ABC,"E","Producers make food using sunlight.")]},
{h:"Q10 · Parts of a plant",svg:PLANT,box:["stem","root","flower","leaf"],q:[sl("1",0,"flower","Top of the plant."),sl("2",0,"stem","The long stalk."),sl("3",0,"leaf","Makes food."),sl("4",0,"root","Underground.")]},
{h:"Investigation · Does sunlight help plants grow?",note:"Plant A is in a sunny place. Plant B is in a dark cupboard. Both get the same water.",q:[tx("a) What is the student investigating?","sun|light","Whether sunlight helps plants grow","Only light changes."),tx("b) Which plant will grow more healthily?","\\ba\\b|sunny","Plant A (in the sun)","Plants need light."),tx("c) What should stay the same to make it a fair test?","water|same|soil|pot|size","The amount of water (also same plant, pot and soil)","A fair test changes only ONE thing."),tx("d) What could the student observe or measure?","height|tall|colou?r|leaves|size|grow|measure|green","Plant height, leaf colour or number of leaves","Measure and compare the plants.")]}];
const N=S.reduce((a,s)=>a+s.q.length,0);let i=0,sc=[],nm="";
const esc=t=>String(t).replace(/"/g,"&quot;");
function start(){A.innerHTML=`<h1>🌱 Year 3 Science Quiz</h1><div class=mu>Plants · Food chains · Human organs<br>${N} marks · marks itself · works on phone and computer</div><div class=c><label>Your name<br><input type=text id=nm placeholder="Type your name" autocomplete="off"></label></div><button onclick="nm=$('#nm').value.trim();sc=[];i=0;show()">Start quiz ▶</button>`}
function show(){const s=S[i];let h=`<div class=bar><i style="width:${i/S.length*100}%"></i></div><p class=mu>Section ${i+1} of ${S.length}</p><h2>${s.h}</h2>`;
if(s.note)h+=`<div class=c>${s.note}</div>`;if(s.svg)h+=s.svg;if(s.box)h+=`<div class=wb>${s.box.map(w=>`<span>${w}</span>`).join("")}</div>`;
s.q.forEach((q,k)=>{h+=`<div class=c><b>${s.svg?"Organ/part "+q[0]:q[0]}</b>`;
if(q[1]=="mc")h+=q[3].map((o,n)=>`<label class=o><input type=radio name=q${k} value="${esc(o)}">${"abcd"[n]}) ${o}</label>`).join("");
else if(q[1]=="sel"){const o=q[3]||s.box;h+=`<select id=q${k}><option value="">Choose…</option>${o.map(x=>`<option>${x}</option>`).join("")}</select>`}
else h+=`<input type=text id=q${k} placeholder="Type your answer" autocomplete="off" autocapitalize="off">`;
h+=`<div id=r${k}></div></div>`});
A.innerHTML=h+`<button id=ck>Check my answers</button><div id=sm></div>`;window.scrollTo(0,0);$("#ck").onclick=check}
function check(){const s=S[i];let p=0;s.q.forEach((q,k)=>{let v,ok,ans=q[2];
if(q[1]=="mc"){const c=document.querySelector(`input[name=q${k}]:checked`);v=c?c.value:"";ok=v==ans}
else if(q[1]=="sel"){v=$("#q"+k).value;ok=v.toLowerCase()==ans.toLowerCase()}
else{v=$("#q"+k).value.trim().toLowerCase();ans=q[3];ok=q[2]=="TWO"?(v.match(/water|sun|light|air|space|nutrient|mineral|soil|warm/g)||[]).filter((x,n,a)=>a.indexOf(x)==n).length>=2:new RegExp(q[2]).test(v)}
if(ok)p++;$("#r"+k).innerHTML=`<div class="fb ${ok?"g":"b"}">${ok?"✅ Correct!":"❌ Not quite. Answer: <b>"+ans+"</b>"}<br>${q[4]}</div>`});
sc[i]=p;$("#ck").remove();$("#sm").innerHTML=`<div class=c><div class=big>${p} / ${s.q.length}</div></div><button onclick="${i+1<S.length?"i++;show()":"fin()"}">${i+1<S.length?"Next section ▶":"See my results 🏆"}</button>`;$("#sm").scrollIntoView({behavior:"smooth"})}
function fin(){const t=sc.reduce((a,b)=>a+b,0),p=Math.round(t/N*100);
A.innerHTML=`<h1>${p>=80?"🌟 Brilliant":p>=50?"👍 Good job":"💪 Keep practising"}${nm?", "+nm:""}!</h1><div class=c><div class=big>${t} / ${N}</div><p style="text-align:center">${p}%</p></div><div class=c>${S.map((s,n)=>`<div>${s.h.split(" · ")[0]}: <b>${sc[n]}/${s.q.length}</b>${sc[n]<s.q.length*.6?" 👈 practise this":""}</div>`).join("")}</div><p class=mu>Tip: take a screenshot to share your score.</p><button onclick="start()">Try again</button>`;window.scrollTo(0,0)}
start();
</script></main></body></html>
